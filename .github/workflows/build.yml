name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: allow git:// (musl-libc.org has no working https git backend)
        run: git config --global protocol.git.allow always
      - name: init upstream submodule
        run: git submodule update --init upstream
      - name: checkout neoos-kernel (shim + toolchain/build.sh)
        run: git clone --depth 1 https://github.com/NeoOSOrganization/neoos-kernel neoos-kernel-ref
      - name: cache cross-toolchain
        uses: actions/cache@v4
        with:
          path: ~/opt/cross-x86_64-elf
          key: x86_64-elf-toolchain-${{ hashFiles('neoos-kernel-ref/toolchain/build.sh') }}
      - name: build cross-toolchain (skips if cache hit)
        run: neoos-kernel-ref/toolchain/build.sh
      - name: build
        run: |
          export PATH="$HOME/opt/cross-x86_64-elf/bin:$PATH"
          make KERNEL_SHIM_DIR=$(pwd)/neoos-kernel-ref/third_party/shim
      - run: make verify
